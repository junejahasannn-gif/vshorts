<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViralTap - 1-Min Reel Maker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0B0F19; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; backdrop-filter: blur(10px); }
        .tap-btn { transition: all 0.2s; cursor: pointer; }
        .tap-btn:active { transform: scale(0.92); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 pb-12">

    <div class="w-full max-w-md mx-auto">
        
        <!-- Header -->
        <div class="flex justify-between items-center py-4">
            <h1 class="text-2xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">⚡ ViralTap</h1>
            <div class="bg-gray-800 px-3 py-1.5 rounded-full text-xs font-bold border border-gray-700">
                <span class="text-yellow-400">⚡</span> <span id="creditCount">3</span> Credits
            </div>
        </div>

        <!-- Main Headline -->
        <div class="text-center mb-6 mt-2">
            <h2 class="text-3xl font-black mb-1">अब 1 मिनट में<br><span class="text-pink-500">वायरल रील्स</span> बनाएं</h2>
            <p class="text-gray-400 text-xs">बिना किसी झंझट के, एक क्लिक में AI स्क्रिप्ट पाएं</p>
        </div>

        <!-- Input Box -->
        <div class="glass-card p-3 mb-4">
            <input type="text" id="ideaInput" placeholder="Apna idea likhiye (Jaise: Hanuman Ji)..." class="w-full bg-transparent border-none text-sm outline-none text-white placeholder-gray-400 p-2">
        </div>

        <!-- Category Grid -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <button onclick="makeScript('Drill Rap')" class="tap-btn glass-card p-4 flex flex-col items-center hover:bg-red-900/20 border-red-500/20">
                <span class="text-3xl mb-1">🔥</span><span class="font-semibold text-xs text-red-200">Drill Rap</span>
            </button>
            <button onclick="makeScript('Anime Action')" class="tap-btn glass-card p-4 flex flex-col items-center hover:bg-blue-900/20 border-blue-500/20">
                <span class="text-3xl mb-1">⚔️</span><span class="font-semibold text-xs text-blue-200">Anime Action</span>
            </button>
            <button onclick="makeScript('Dark Poetry')" class="tap-btn glass-card p-4 flex flex-col items-center hover:bg-purple-900/20 border-purple-500/20">
                <span class="text-3xl mb-1">🎙️</span><span class="font-semibold text-xs text-purple-200">Dark Poetry</span>
            </button>
            <button onclick="makeScript('Movie Recap')" class="tap-btn glass-card p-4 flex flex-col items-center hover:bg-green-900/20 border-green-500/20">
                <span class="text-3xl mb-1">🎬</span><span class="font-semibold text-xs text-green-200">Movie Recap</span>
            </button>
        </div>

        <!-- Generate Button -->
        <button onclick="generateInstantScript()" class="w-full bg-gradient-to-r from-pink-500 to-orange-500 p-4 rounded-xl font-bold text-white shadow-[0_5px_20px_rgba(236,72,153,0.3)] tap-btn text-lg mb-6">
            जनरेट करें (1 क्रेडिट) 🚀
        </button>

        <!-- Result Area -->
        <div id="loading" class="hidden text-center text-cyan-400 font-bold animate-pulse text-sm mb-4">
            AI Script Taiyar Ho Rahi Hai... ⏳
        </div>
        
        <div id="resultArea" class="hidden glass-card p-4 border-cyan-500/30 mb-8">
            <h3 class="font-bold text-cyan-400 mb-3 flex justify-between items-center text-sm">
                ✅ Aapki Script Ready Hai! 
                <div class="flex gap-2">
                    <button onclick="copyText()" class="text-xs bg-gray-700 px-3 py-1.5 rounded text-white tap-btn">📋 Copy</button>
                    <button onclick="shareWhatsApp()" class="text-xs bg-green-600 px-3 py-1.5 rounded text-white tap-btn">💬 Share</button>
                </div>
            </h3>
            <div id="output" class="text-sm text-gray-300 whitespace-pre-wrap h-52 overflow-y-auto bg-black/40 p-3 rounded-lg border border-gray-800 leading-relaxed"></div>
        </div>

        <!-- Footer -->
        <footer class="border-t border-gray-800 pt-6 text-center text-xs text-gray-500">
            <p class="mb-1">© 2026 ViralTap.in • Palanpur, Gujarat</p>
            <p class="text-[10px] text-gray-600">100% Copyright Free Video Generator Engine</p>
        </footer>

    </div>

    <script>
        let credits = localStorage.getItem('vt_credits') || 3;
        document.getElementById('creditCount').innerText = credits;

        function makeScript(category) {
            document.getElementById('ideaInput').value = category + " Special Reel";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function generateInstantScript() {
            let input = document.getElementById('ideaInput').value.trim();
            if(!input) {
                input = "Viral Instagram Reel";
            }

            if(credits <= 0) {
                alert('Aapke aaj ke free credits khatam ho gaye hain!');
                return;
            }

            document.getElementById('resultArea').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            setTimeout(() => {
                let generatedText = `[🔥 VIRAL HOOK]\n"Ruko! Agar yeh nahi dekha na, toh samajh lo kuch nahi dekha!"\n\n[🎬 VISUALS SCENE]\n- Background me ekdum dark aur cinematic action clip chalegi.\n- Text pop-up aayega bade aksharon me: "${input}".\n\n[🎙️ VOICEOVER / DIALOGUE]\nLog kehte hain ki sapne wo nahi jo sote waqt dekhe jayein... sapne wo hain jo sone na dein!\nAaj hi waqt hai badlaav laane ka. Is ${input} ke peeche ki sachai jaan kar sabhi ke hosh ud jayenge.\n\n[⚡ CALL TO ACTION]\nAbhi follow karo aur apne dosto ke sath share karo!`;

                credits--;
                localStorage.setItem('vt_credits', credits);
                document.getElementById('creditCount').innerText = credits;

                document.getElementById('output').innerText = generatedText;
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('resultArea').classList.remove('hidden');
            }, 1000);
        }

        function copyText() {
            navigator.clipboard.writeText(document.getElementById('output').innerText);
            alert("Script Copy ho gayi! Ab ise paste karke video banao.");
        }

        function shareWhatsApp() {
            let text = document.getElementById('output').innerText;
            let msg = encodeURIComponent("Dekho maine ViralTap se kitni tagdi script banai hai:\n\n" + text);
            window.open(`https://api.whatsapp.com/send?text=${msg}`);
        }
    </script>
</body>
</html>
