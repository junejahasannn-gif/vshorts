<script>

  /* ================= DATA ================= */

  const languages = [
    "Hindi",
    "English",
    "Bengali",
    "Punjabi",
    "Gujarati",
    "Kannada",
    "Malayalam",
    "Marathi",
    "Tamil",
    "Telugu",
    "Urdu",
    "Odia"
  ];

  let selectedNormalLanguage = "Hindi";
  let selectedFunnyLanguage = "Hindi";

  let normalRatio = "9:16";
  let funnyRatio = "9:16";

  let normalDuration = 60;

  let selectedJoke =
    "जब दोस्त बोले: भाई तू बदल गया है...";

  let currentVideoType = "normal";

  let videoDuration = 45;

  let playbackSpeed = 1;

  let generatedVideoData = null;

  let renderJobData = null;


  /* ================= PAGE ================= */

  function showPage(id) {

    document.querySelectorAll(".page").forEach(page => {
      page.classList.add("hidden-page");
    });

    document.getElementById(id).classList.remove("hidden-page");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* ================= LANGUAGE UI ================= */

  function renderLanguages(containerId, type) {

    const container =
      document.getElementById(containerId);

    container.innerHTML = "";

    languages.forEach(language => {

      const button =
        document.createElement("button");

      button.className =
        "option-btn " +
        ((type === "normal"
          ? selectedNormalLanguage
          : selectedFunnyLanguage) === language
          ? "active"
          : "");

      button.textContent = language;

      button.onclick = () => {

        if (type === "normal") {

          selectedNormalLanguage = language;

          document.getElementById(
            "normalLanguageLabel"
          ).textContent = language;

          renderLanguages(
            "normalLanguages",
            "normal"
          );

        } else {

          selectedFunnyLanguage = language;

          renderLanguages(
            "funnyLanguages",
            "funny"
          );

        }

      };

      container.appendChild(button);

    });

  }


  renderLanguages(
    "normalLanguages",
    "normal"
  );

  renderLanguages(
    "funnyLanguages",
    "funny"
  );


  /* ================= HOME → NORMAL ================= */

  function openNormalStudio() {

    const story =
      document.getElementById(
        "homeStory"
      ).value.trim();

    document.getElementById(
      "normalStory"
    ).value = story;

    showPage("studioPage");

  }


  /* ================= OPTIONS ================= */

  function selectOption(button, type) {

    const parent =
      button.parentElement;

    parent
      .querySelectorAll(".option-btn")
      .forEach(btn => {
        btn.classList.remove("active");
      });

    button.classList.add("active");

    if (type === "normalRatio") {
      normalRatio =
        button.dataset.ratio;
    }

    if (type === "funnyRatio") {
      funnyRatio =
        button.dataset.ratio;
    }

    if (type === "normalDuration") {
      normalDuration =
        Number(button.dataset.duration);
    }

  }


  /* ================= JOKES ================= */

  function selectJoke(card, joke) {

    document
      .querySelectorAll(".story-card")
      .forEach(item => {
        item.classList.remove("selected");
      });

    card.classList.add("selected");

    selectedJoke = joke;

    document.getElementById(
      "funnyJoke"
    ).value = joke;

  }


  /* ================= VOICE ================= */

  function changeVoice(elementId) {

    const voices = [
      "Ankit",
      "Swara",
      "Aarav",
      "Neha"
    ];

    const current =
      document.getElementById(
        elementId
      ).textContent.trim();

    const index =
      voices.indexOf(current);

    const next =
      voices[
        (index + 1) %
        voices.length
      ];

    document.getElementById(
      elementId
    ).textContent = next;

    showToast(
      "Voice changed to " + next
    );

  }


  /* ================= MUSIC ================= */

  function changeMusic(elementId) {

    const music = [
      "cartoon-music-2",
      "City of the Wolf",
      "Funny Bounce",
      "Comedy Beat"
    ];

    const current =
      document.getElementById(
        elementId
      ).textContent.trim();

    const index =
      music.indexOf(current);

    const next =
      music[
        (index + 1) %
        music.length
      ];

    document.getElementById(
      elementId
    ).textContent = next;

    showToast(
      "Music changed to " + next
    );

  }


  /* ================= BRANDING ================= */

  function editBrand(elementId) {

    const current =
      document.getElementById(
        elementId
      ).textContent.trim();

    const name =
      prompt(
        "Instagram / Facebook Page Name:",
        current ===
          "Insta / FB पेज नाम जोड़ें"
          ? ""
          : current
      );

    if (
      name !== null &&
      name.trim()
    ) {

      document.getElementById(
        elementId
      ).textContent =
        name.trim();

    }

  }


  /* ================= GENERATE ================= */

  function generateFunnyVideo() {

    const joke =
      document.getElementById(
        "funnyJoke"
      ).value.trim();

    if (!joke) {

      showToast(
        "पहले कोई joke चुनें या लिखें"
      );

      return;

    }

    currentVideoType = "funny";

    startGeneration({
      text: joke,
      language: selectedFunnyLanguage,
      aspectRatio: funnyRatio,
      duration: 30,
      voice:
        document.getElementById(
          "funnyVoiceText"
        ).textContent.trim(),
      music:
        document.getElementById(
          "funnyMusicText"
        ).textContent.trim(),
      branding:
        document.getElementById(
          "funnyBrandText"
        ).textContent.trim()
    });

  }


  async function generateNormalVideo() {

    const story =
      document.getElementById(
        "normalStory"
      ).value.trim();

    if (!story) {

      showToast(
        "पहले अपनी story लिखें"
      );

      return;

    }

    currentVideoType = "normal";

    startGeneration({
      text: story,
      language: selectedNormalLanguage,
      aspectRatio: normalRatio,
      duration: normalDuration,
      voice:
        document.getElementById(
          "normalVoiceText"
        ).textContent.trim(),
      music:
        document.getElementById(
          "normalMusicText"
        ).textContent.trim(),
      branding:
        document.getElementById(
          "normalBrandText"
        ).textContent.trim()
    });

  }


  /* ================= REAL API GENERATION ================= */

  async function startGeneration(options) {

    showPage("generatingPage");

    setGenerationProgress(
      5,
      "AI generation शुरू हो रही है...",
      "Story को AI script में बदला जा रहा है"
    );

    try {

      /* ---------------------------------
       * STEP 1
       * Gemini script generation
       * --------------------------------- */

      setGenerationProgress(
        15,
        "AI story तैयार की जा रही है...",
        "आपकी story को scenes में बदला जा रहा है"
      );

      const scriptResponse =
        await fetch(
          "/api/generate-script",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              story:
                currentVideoType === "normal"
                  ? options.text
                  : "",

              joke:
                currentVideoType === "funny"
                  ? options.text
                  : "",

              videoType:
                currentVideoType,

              language:
                options.language,

              aspectRatio:
                options.aspectRatio,

              duration:
                options.duration,

              voice:
                options.voice,

              music:
                options.music,

              branding:
                options.branding

            })
          }
        );


      const scriptData =
        await readJsonResponse(
          scriptResponse
        );


      if (
        !scriptResponse.ok ||
        !scriptData.success
      ) {

        throw new Error(
          scriptData.error ||
          scriptData.details ||
          "AI script generation failed."
        );

      }


      generatedVideoData =
        scriptData;


      setGenerationProgress(
        40,
        "AI scenes तैयार हो गए...",
        `${scriptData.totalScenes || scriptData.scenes?.length || 0} scenes तैयार किए गए`
      );


      /* ---------------------------------
       * STEP 2
       * Render job / Vercel Sandbox
       * --------------------------------- */

      setGenerationProgress(
        55,
        "Video render engine शुरू हो रहा है...",
        "Vercel Sandbox तैयार किया जा रहा है"
      );


      const renderResponse =
        await fetch(
          "/api/render-video",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              scenes:
                scriptData.scenes,

              videoType:
                currentVideoType,

              aspectRatio:
                options.aspectRatio,

              duration:
                options.duration,

              language:
                options.language,

              voice:
                options.voice,

              music:
                options.music,

              branding:
                options.branding

            })
          }
        );


      const renderData =
        await readJsonResponse(
          renderResponse
        );


      if (
        !renderResponse.ok ||
        !renderData.success
      ) {

        throw new Error(
          renderData.error ||
          renderData.details ||
          "Render engine failed."
        );

      }


      renderJobData =
        renderData;


      setGenerationProgress(
        75,
        "Render engine ready...",
        "Video composition तैयार है"
      );


      /* ---------------------------------
       * STEP 3
       * Prepare result
       * --------------------------------- */

      setGenerationProgress(
        90,
        "Video preview तैयार हो रहा है...",
        "AI scenes को preview में लगाया जा रहा है"
      );


      await wait(500);


      prepareResult(
        scriptData
      );


      setGenerationProgress(
        100,
        "Video ready!",
        "AI video project तैयार है"
      );


      await wait(600);


      showPage("resultPage");


      showToast(
        "AI scenes successfully generated 🎬"
      );


    } catch (error) {

      console.error(
        "VIRALTAP GENERATION ERROR:",
        error
      );

      showPage(
        currentVideoType === "funny"
          ? "funnyPage"
          : "studioPage"
      );

      showToast(
        error?.message ||
        "Video generation failed."
      );

    }

  }


  /* ================= API HELPERS ================= */

  async function readJsonResponse(response) {

    const text =
      await response.text();

    let data = {};

    try {

      data =
        text
          ? JSON.parse(text)
          : {};

    } catch {

      throw new Error(
        "Server returned an invalid response."
      );

    }

    return data;

  }


  function setGenerationProgress(
    percent,
    stepText,
    messageText
  ) {

    const bar =
      document.getElementById(
        "generationBar"
      );

    const percentElement =
      document.getElementById(
        "generationPercent"
      );

    const step =
      document.getElementById(
        "generationStep"
      );

    const message =
      document.getElementById(
        "generationMessage"
      );

    bar.style.width =
      percent + "%";

    percentElement.textContent =
      percent + "%";

    step.textContent =
      stepText;

    message.textContent =
      messageText;

  }


  function wait(ms) {

    return new Promise(
      resolve =>
        setTimeout(resolve, ms)
    );

  }


  /* ================= RESULT ================= */

  function prepareResult(scriptData) {

    const scenes =
      Array.isArray(
        scriptData?.scenes
      )
        ? scriptData.scenes
        : [];


    videoDuration =
      Number(
        scriptData?.duration ||
        scriptData?.videoDuration ||
        (
          currentVideoType === "funny"
            ? 30
            : normalDuration
        )
      );


    if (!videoDuration) {
      videoDuration = 30;
    }


    document.getElementById(
      "totalTime"
    ).textContent =
      formatTime(videoDuration);


    document.getElementById(
      "currentTime"
    ).textContent =
      "0:00";


    document.getElementById(
      "sceneSummary"
    ).textContent =
      `${scenes.length} scenes • ${formatTime(videoDuration)} total`;


    createScenes(
      scenes
    );


    if (
      currentVideoType ===
      "funny"
    ) {

      document.getElementById(
        "resultVoice"
      ).textContent =
        document.getElementById(
          "funnyVoiceText"
        ).textContent;

      document.getElementById(
        "resultMusic"
      ).textContent =
        document.getElementById(
          "funnyMusicText"
        ).textContent;

    } else {

      document.getElementById(
        "resultVoice"
      ).textContent =
        document.getElementById(
          "normalVoiceText"
        ).textContent;

      document.getElementById(
        "resultMusic"
      ).textContent =
        document.getElementById(
          "normalMusicText"
        ).textContent;

    }


    switchResultTab(
      "scenes"
    );

  }


  /* ================= REAL AI SCENES ================= */

  function createScenes(scenes) {

    const container =
      document.getElementById(
        "sceneList"
      );

    container.innerHTML = "";


    if (!scenes.length) {

      container.innerHTML = `
        <div class="text-gray-500">
          No scenes generated.
        </div>
      `;

      return;

    }


    let elapsed = 0;


    scenes.forEach(
      (scene, index) => {

        const duration =
          Number(
            scene?.duration
          ) || 3;


        const card =
          document.createElement(
            "div"
          );

        card.className =
          "scene-thumb";


        const caption =
          scene?.caption ||
          scene?.narration ||
          scene?.dialogue ||
          scene?.scene ||
          `Scene ${index + 1}`;


        const visual =
          scene?.visualPrompt ||
          "AI Scene";


        card.innerHTML = `

          <div class="thumb-bg"></div>

          <div class="scene-thumb-content">

            <div class="flex justify-between gap-2">

              <span class="bg-white/20 px-2 py-1 rounded-lg text-xs">
                AI
              </span>

              <span class="text-xs">
                ${duration}s
              </span>

            </div>


            <div>

              <div class="text-2xl font-black">
                #${index + 1}
              </div>

              <div class="text-xs text-white/80 mt-1 line-clamp-3">
                ${escapeHtml(
                  String(caption)
                )}
              </div>

            </div>

          </div>
        `;


        const sceneStart =
          elapsed;


        card.onclick = () => {

          document.getElementById(
            "currentTime"
          ).textContent =
            formatTime(
              sceneStart
            );


          showToast(
            `Scene #${index + 1} selected`
          );

        };


        container.appendChild(
          card
        );


        elapsed += duration;

      }
    );

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* ================= RESULT TABS ================= */

  function switchResultTab(tab) {

    const scenes =
      document.getElementById(
        "scenesView"
      );

    const preview =
      document.getElementById(
        "previewView"
      );

    const scenesTab =
      document.getElementById(
        "scenesTab"
      );

    const previewTab =
      document.getElementById(
        "previewTab"
      );


    if (tab === "scenes") {

      scenes.classList.remove(
        "hidden"
      );

      preview.classList.add(
        "hidden"
      );

      scenesTab.className =
        "px-5 py-3 font-bold border-b-2 border-black";

      previewTab.className =
        "px-5 py-3 text-gray-500";

    } else {

      scenes.classList.add(
        "hidden"
      );

      preview.classList.remove(
        "hidden"
      );

      previewTab.className =
        "px-5 py-3 font-bold border-b-2 border-black";

      scenesTab.className =
        "px-5 py-3 text-gray-500";

    }

  }


  /* ================= SPEED ================= */

  function changeSpeed(amount) {

    playbackSpeed =
      Math.min(
        2,
        Math.max(
          .5,
          playbackSpeed + amount
        )
      );


    document.getElementById(
      "speedText"
    ).textContent =
      playbackSpeed % 1 === 0
        ? playbackSpeed + "×"
        : playbackSpeed.toFixed(2) + "×";

  }


  /* ================= PREVIEW ================= */

  function playPreview() {

    if (
      renderJobData?.videoUrl
    ) {

      const area =
        document.getElementById(
          "previewVideoArea"
        );

      area.innerHTML = `
        <video
          src="${renderJobData.videoUrl}"
          controls
          autoplay
          playsinline
          style="width:100%;height:100%;object-fit:cover;"
        ></video>
      `;

      return;

    }


    showToast(
      "MP4 renderer अभी connect किया जा रहा है."
    );

  }


  /* ================= DOWNLOAD ================= */

  function downloadVideo() {

    if (
      renderJobData?.videoUrl
    ) {

      const link =
        document.createElement(
          "a"
        );

      link.href =
        renderJobData.videoUrl;

      link.download =
        "viraltap-video.mp4";

      link.target =
        "_blank";

      link.click();

      return;

    }


    showToast(
      "Real MP4 renderer next step में connect होगा."
    );

  }


  /* ================= SHARE ================= */

  function instagramShare() {

    window.open(
      "https://www.instagram.com/",
      "_blank"
    );

  }


  function whatsappShare() {

    const text =
      "Maine ViralTap Studio se ek AI video banayi 🎬";

    window.open(
      "https://wa.me/?text=" +
      encodeURIComponent(text),
      "_blank"
    );

  }


  /* ================= FULLSCREEN ================= */

  function fullScreenPreview() {

    const element =
      document.getElementById(
        "previewVideoArea"
      );

    if (
      element.requestFullscreen
    ) {

      element.requestFullscreen();

    }

  }


  /* ================= REPORT ================= */

  function reportVideo() {

    const email =
      "mailto:junejahasannn@gmail.com?subject=Video Report";

    window.location.href =
      email;

  }


  /* ================= UTILS ================= */

  function formatTime(seconds) {

    seconds =
      Math.round(
        Number(seconds) || 0
      );

    const minutes =
      Math.floor(
        seconds / 60
      );

    const secs =
      seconds % 60;

    return (
      minutes +
      ":" +
      String(secs).padStart(
        2,
        "0"
      )
    );

  }


  function showToast(message) {

    const toast =
      document.getElementById(
        "toast"
      );

    toast.textContent =
      message;

    toast.style.display =
      "block";

    clearTimeout(
      window.toastTimer
    );

    window.toastTimer =
      setTimeout(() => {

        toast.style.display =
          "none";

      }, 4000);

  }

</script>
