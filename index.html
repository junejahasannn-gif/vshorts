<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vshorts - Free AI Reel Maker</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Space Grotesk', 'sans-serif'] } } } }
  </script>
</head>
<body class="bg-[#0b0c10] text-gray-100 font-sans min-h-screen pb-10 antialiased">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-[#0b0c10]/80 backdrop-blur-xl border-b border-white/5 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-violet-600 to-cyan-400 flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-[19px]">auto_awesome</span>
      </div>
      <span class="font-display font-bold text-xl tracking-tight text-white">V<span class="text-cyan-400">shorts</span></span>
    </div>
    <span class="px-2 py-0.5 text-[11px] font-bold tracking-wider rounded bg-white/10 text-gray-200" id="limitDisplay">3 Left Today</span>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">
    <div class="text-center space-y-3">
      <h1 class="text-2xl font-display font-extrabold text-white leading-tight">
        1 Minute me <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-violet-400">Viral Reels</span> Banayein
      </h1>
      <p class="text-sm text-gray-400">Hindi ya Hinglish me topic likho, AI automatically script aur video flow bana dega.</p>
    </div>

    <!-- Input Area -->
    <div class="p-4 rounded-2xl bg-gradient-to-b from-[#181926] to-[#12131d] border border-white/10 shadow-xl space-y-4">
      <div class="flex items-center gap-2 text-sm font-semibold text-white">
        <span class="material-symbols-outlined text-violet-400 text-base">edit_note</span>
        <span>Topic ya Idea Likhein</span>
      </div>
      <textarea id="topicInput" rows="3" class="w-full bg-[#0d0e15] border border-white/10 rounded-xl p-3 text-sm text-gray-100 placeholder-gray-500 focus:outline-none focus:border-cyan-500" placeholder="Jaise: Motivation reel, joke, ya business ad..."></textarea>
      
      <button id="generateBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-violet-600 to-cyan-500 hover:opacity-95 text-white font-bold text-sm shadow-lg flex items-center justify-center gap-2 transition-all">
        <span class="material-symbols-outlined">auto_awesome</span> Generate 1-Minute Reel
      </button>
    </div>

    <!-- Output Area -->
    <div id="outputSection" class="hidden p-4 rounded-2xl bg-[#12131d] border border-white/10 space-y-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2 text-xs font-semibold text-white">
          <span class="material-symbols-outlined text-emerald-400">check_circle</span>
          <span>Aapki Script Ready Hai</span>
        </div>
      </div>
      <div id="scriptContent" class="p-3 rounded-xl bg-[#0b0c11] border border-white/5 text-sm text-gray-200 whitespace-pre-wrap leading-relaxed">
        <!-- Script yahan aayegi -->
      </div>
      <button class="w-full py-2.5 rounded-xl bg-white/5 border border-white/10 text-gray-300 font-medium text-xs mt-2" onclick="alert('Video Maker Feature Coming Soon!')">
        Proceed to Video Generation
      </button>
    </div>
  </main>

  <!-- JavaScript Logic -->
  <script>
    function checkLimit() {
      let today = new Date().toDateString();
      let usage = JSON.parse(localStorage.getItem("vshortsUsage")) || { date: today, count: 0 };

      if (usage.date !== today) {
        usage = { date: today, count: 0 };
      }

      document.getElementById('limitDisplay').innerText = `${3 - usage.count} Left Today`;

      if (usage.count >= 3) {
        alert("Aapki aaj ki 3 free limit khatam ho gayi hai. Kal try karein ya Premium lein!");
        return false;
      }
      return true;
    }

    function incrementLimit() {
      let today = new Date().toDateString();
      let usage = JSON.parse(localStorage.getItem("vshortsUsage")) || { date: today, count: 0 };
      usage.count += 1;
      localStorage.setItem("vshortsUsage", JSON.stringify(usage));
      document.getElementById('limitDisplay').innerText = `${3 - usage.count} Left Today`;
    }

    checkLimit();

    document.getElementById("generateBtn").addEventListener("click", async () => {
      const topic = document.getElementById("topicInput").value;
      
      if (!topic) {
        alert("Pehle koi topic toh likho bhai!");
        return;
      }

      if (!checkLimit()) return; 

      const btn = document.getElementById("generateBtn");
      btn.innerHTML = `Generating Script... ⏳`;
      btn.disabled = true;

      // YAHAN APNI GOOGLE STUDIO KI API KEY DALO 👇
      const apiKey = "AQ.Ab8RN6K4haOGQIANbQd_zn1yNWsvzq1p-4JS-qshLooAV_y-YQ"; 
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      const promptText = `Write a viral 1-minute Instagram Reel/YouTube Shorts script in Hindi (written in Hinglish or Hindi) on the topic: "${topic}". 
      Format strictly like this:
      [HOOK - 0:00-0:05]: (Catchy opening)
      [BEAT 1 - 0:06-0:25]: (Main content)
      [BEAT 2 - 0:26-0:45]: (Climax or fact)
      [CTA - 0:46-0:58]: (Call to action)
      Include suggested visuals in brackets.`;

      try {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });

        const data = await response.json();
        const scriptOutput = data.candidates[0].content.parts[0].text;

        document.getElementById("scriptContent").innerText = scriptOutput;
        document.getElementById("outputSection").classList.remove("hidden");
        incrementLimit();

      } catch (error) {
        alert("Kuch error aayi hai. Apni API Key check karo!");
        console.error(error);
      } finally {
        btn.innerHTML = `<span class="material-symbols-outlined">auto_awesome</span> Generate 1-Minute Reel`;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
