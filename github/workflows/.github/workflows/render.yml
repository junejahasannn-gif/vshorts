name: ViralTap Video Renderer

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique ViralTap render job ID"
        required: true
        type: string

      duration:
        description: "Video duration"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"

      propsBase64:
        description: "Base64 encoded Remotion props"
        required: true
        type: string

run-name: Render ${{ inputs.jobId }}

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund

      - name: Render and upload video
        env:
          JOB_ID: ${{ inputs.jobId }}
          VIDEO_DURATION: ${{ inputs.duration }}
          PROPS_BASE64: ${{ inputs.propsBase64 }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

        run: |
          node scripts/render-runner.mjs
