name: ViralTap Video Renderer

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique ViralTap render job ID"
        required: true
        type: string

      duration:
        description: "Video duration"
        required: true
        type: choice
        options:
          - "30"
          - "60"
          - "180"

      propsBase64:
        description: "Base64 encoded Remotion props"
        required: true
        type: string

run-name: Render ${{ inputs.jobId }}

permissions:
  contents: read
  id-token: write

jobs:
  render:
    name: Render ViralTap Video
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      # Lockfile nahi hai, isliye npm cache completely disabled
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          package-manager-cache: false

      # 3. Check Node and npm
      - name: Check Node.js
        run: |
          node --version
          npm --version

      # 4. Install FFmpeg
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg

      # 5. Install project dependencies
      # package-lock.json required nahi hai
      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --no-package-lock

      # 6. Render video
      - name: Render video
        env:
          JOB_ID: ${{ inputs.jobId }}
          VIDEO_DURATION: ${{ inputs.duration }}
          PROPS_BASE64: ${{ inputs.propsBase64 }}
          VIRALTAP_WORKER_URL: https://vshorts-app.vercel.app/api/render-worker
          # FIX: required so generate-visuals.js / generate-voice.js can
          # verify this call actually came from the render pipeline, not
          # a random visitor hitting those Gemini-backed endpoints
          # directly. Must match the Vercel env var of the same name.
          INTERNAL_WORKER_SECRET: ${{ secrets.INTERNAL_WORKER_SECRET }}
        run: |
          node scripts/render-runner.mjs
